[package]
name = "shift_scheduler"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = "0.4.39"
log = "0.4.22"
mockall = "0.13.1"
rand = "0.8.5"
rand_distr = "0.4.3"
wasm-logger = "0.2.0"

[dependencies.yew]
version = "0.21.0"
features = ["csr"]

[dependencies.web-sys]
version = "0.3.76"
features = [
    "HtmlButtonElement",
    "HtmlInputElement",
    "HtmlSelectElement",
]
